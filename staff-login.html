<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>才薪云 · 员工移动端</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body.login-body { background:linear-gradient(135deg,#07c160,#0e8a55); }
  .login-title { color:#07c060; }
  .login-divider { background:#b7eb8f; }
  .login-btn { background:#07c060; }
  .login-btn:hover { background:#06ad56; }
  .staff-tag { display:inline-block; background:#e9f9ef; color:#07c060; border-radius:20px; padding:3px 12px; font-size:12px; margin-bottom:10px; }
</style>
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-left">
    <div class="login-left-inner">
      <p class="login-slogan-sm">员工随身 · 服务直达</p>
      <p class="login-slogan">才薪云员工移动端（微信小程序）：工资条、考勤打卡、请假申请、培训认证、AI 问答。与中心管理端、甲方客户端共享同一数据底座，需求双向流转。</p>
      <div class="login-illustration">
        <div class="illus-card">
          <div class="illus-line w70"></div>
          <div class="illus-line w90"></div>
          <div class="illus-line w60"></div>
          <div class="illus-thumb"></div>
        </div>
        <div class="illus-figure">
          <div class="illus-head"></div>
          <div class="illus-body"><span class="illus-badge" style="background:#07c060">微信</span></div>
          <div class="illus-legs"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-card">
      <span class="staff-tag">📱 员工移动端（微信小程序）</span>
      <h1 class="login-title">员工登录</h1>
      <div class="login-divider"></div>
      <form id="sForm" autocomplete="off">
        <input class="login-input" id="sname" type="text" placeholder="姓名 / 工号" value="张×">
        <input class="login-input" id="sproj" type="text" placeholder="所属项目" value="甲铁路局乘务服务一队">
        <button class="login-btn" type="submit">登 录 小 程 序</button>
      </form>
      <p style="font-size:12px;color:#9aa7b8;margin-top:14px">演示账号：张× ｜ <a href="portal.html" style="color:#07c060">返回门户总入口</a></p>
    </div>
    <p class="login-footer">微信扫码体验 · 本端为员工自助轻量端口</p>
  </div>
</div>
<script>
document.getElementById('sForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var n = document.getElementById('sname').value || '员工';
  sessionStorage.setItem('cx_staff', n);
  sessionStorage.setItem('cx_staff_proj', document.getElementById('sproj').value || '甲铁路局乘务服务一队');
  location.href = 'staff.html';
});
</script>
</body>
</html>

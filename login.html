<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>才薪云智慧人力服务平台 - 登录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-left">
    <div class="login-left-inner">
      <p class="login-slogan-sm">高效经营，现在开始</p>
      <p class="login-slogan">才薪云智慧人力服务平台，覆盖蓝领派遣全生命周期，践行"管人＋管项目＋管成本＋管合规"四位一体，助力企业从劳务外包服务商向数据驱动型解决方案服务商跃迁。</p>
      <div class="login-illustration">
        <div class="illus-card">
          <div class="illus-line w60"></div>
          <div class="illus-line w80"></div>
          <div class="illus-line w70"></div>
          <div class="illus-thumb"></div>
        </div>
        <div class="illus-figure">
          <div class="illus-head"></div>
          <div class="illus-body">
            <span class="illus-badge">OK</span>
          </div>
          <div class="illus-legs"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-card">
      <h1 class="login-title">才薪云智慧人力服务平台</h1>
      <div class="login-divider"></div>
      <form id="loginForm" autocomplete="off">
        <input class="login-input" id="username" type="text" placeholder="请输入用户名" value="admin">
        <input class="login-input" id="password" type="password" placeholder="请输入密码" value="123456">
        <div class="login-role">
          <label class="role-item"><input type="radio" name="role" value="executive" checked>企业高管</label>
          <label class="role-item"><input type="radio" name="role" value="manager">项目负责人</label>
          <label class="role-item"><input type="radio" name="role" value="hr">HR管理员</label>
        </div>
        <button class="login-btn" type="submit">登 录</button>
        <div class="login-agree">
          <input type="checkbox" id="agree" checked>
          <label for="agree">我已阅读并同意才薪云智慧人力服务平台 <a>《用户协议及保密承诺》</a> 和 <a>《个人信息保护政策》</a></label>
        </div>
      </form>
    </div>
    <p class="login-footer">推荐使用新版 谷歌 或 Microsoft Edge 浏览器访问本系统</p>
    <p style="text-align:center;margin-top:10px"><a href="portal.html" style="color:#1677ff;text-decoration:none;font-size:13px">返回门户总入口 ›</a></p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var role = document.querySelector('input[name=role]:checked').value;
  sessionStorage.setItem('cx_role', role);
  location.href = 'index.html';
});
</script>
</body>
</html>
